# Configuration Backend DecapBridge
backend:
  name: git-gateway
  repo: theog16000/portfoliov3
  branch: main
  identity_url: https://auth.decapbridge.com/sites/463d6015-f1a8-4d1d-a8b2-0feb79dec96f
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Optionnel : Logo & lien de ton site
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://theogenty.fr

# Garde le mode local pour tes tests sur ton ordi
local_backend: true

# Dossiers d'images
media_folder: "public/images"
public_folder: "/images"

# Tes collections de projets
collections:
  - name: "works"
    label: "Projets"
    folder: "src/content/works"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Image principale", name: "image", widget: "image", required: false }
      - { label: "Catégorie", name: "category", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Lien externe", name: "link", widget: "string", required: false }
      - { label: "Ordre d'affichage", name: "order", widget: "number", required: false }
      - { label: "Contenu de la page", name: "body", widget: "markdown" }