# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: theog16000/portfoliov3
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/463d6015-f1a8-4d1d-a8b2-0feb79dec96f/pkce
  auth_token_endpoint: /sites/463d6015-f1a8-4d1d-a8b2-0feb79dec96f/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://theog16000.github.io/portfoliov3/

# Enable the local backend for local testing
local_backend: true

# Image folders
media_folder: "public/images"
public_folder: "/portfoliov3/images"

# Project collections
collections:
  - name: "works"
    label: "Projects"
    folder: "src/content/works"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Main image", name: "image", widget: "image", required: false }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "External link", name: "link", widget: "string", required: false }
      - { label: "Display order", name: "order", widget: "number", required: false }
      - { label: "Page content", name: "body", widget: "markdown" }